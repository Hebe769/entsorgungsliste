name: APK bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK 35 installieren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Projekt entpacken
        run: unzip -q EntsorgungslisteFranken_AndroidProjekt.zip

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: APK bauen
        run: gradle -p EntsorgungslisteFranken :app:assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: EntsorgungslisteFranken-APK
          path: EntsorgungslisteFranken/app/build/outputs/apk/debug/app-debug.apk
