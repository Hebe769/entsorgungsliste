name: APK erstellen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bauen:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Projekt entpacken
        run: unzip -q EntsorgungslisteFranken_AndroidProjekt.zip -d .

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        run: gradle -p EntsorgungslisteFranken assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: EntsorgungslisteFranken-APK
          path: EntsorgungslisteFranken/app/build/outputs/apk/debug/app-debug.apk
